name: ZANYSURF CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Static Validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The extension is dependency-free MV3 JavaScript — nothing to install.
      - name: Validate extension syntax, manifests, and symbols
        run: node qa/run-static-validation.mjs

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-validation-report
          path: qa/static-validation-report.json

  package:
    runs-on: ubuntu-latest
    name: Package Extension
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - name: Zip extension/ for store upload
        run: |
          cd extension
          zip -r ../zanysurf-extension.zip . -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: zanysurf-extension
          path: zanysurf-extension.zip
